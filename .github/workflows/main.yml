name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract Zip and Structure Project
      run: |
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Unzipping $ZIP_FILE..."
          unzip -o -q "$ZIP_FILE" -d temp_extracted
        else
          echo "No zip file found!"
          exit 1
        fi
        
        PROJ_DIR=$(find temp_extracted -maxdepth 3 -name "settings.gradle.kts" -exec dirname {} \;)
        if [ -n "$PROJ_DIR" ]; then
          echo "Found project at: $PROJ_DIR"
          cp -r "$PROJ_DIR"/* .
        else
          echo "settings.gradle.kts not found!"
          exit 1
        fi

    - name: Root Cause Analysis (Deep Inspection)
      run: |
        python3 -c "
        import os

        print('=== ROOT CAUSE ANALYSIS: SEARCHING FOR 1.8 ===')
        for root, dirs, files in os.walk('.'):
            if '.gradle' in root or 'build' in root or '.git' in root:
                continue
            for file in files:
                if file.endswith('.gradle.kts') or file.endswith('.gradle') or file.endswith('properties'):
                    path = os.path.join(root, file)
                    with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                        lines = f.readlines()
                    for idx, line in enumerate(lines):
                        if '1.8' in line or 'VERSION_1_8' in line or 'jvmTarget' in line or 'compatibility' in line:
                            print(f'Found in {path} (Line {idx+1}): {line.strip()}')
        print('=============================================')
        "

    - name: Generate Gradle Wrapper 8.9
      run: |
        gradle wrapper --gradle-version 8.9
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BitaMonitor-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
