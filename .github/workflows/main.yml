name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract Zip and Structure Project
      run: |
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Unzipping $ZIP_FILE..."
          unzip -o -q "$ZIP_FILE" -d temp_extracted
        else
          echo "No zip file found!"
          exit 1
        fi
        
        PROJ_DIR=$(find temp_extracted -maxdepth 3 -name "settings.gradle.kts" -exec dirname {} \;)
        if [ -n "$PROJ_DIR" ]; then
          echo "Found project at: $PROJ_DIR"
          cp -r "$PROJ_DIR"/* .
        else
          echo "settings.gradle.kts not found!"
          exit 1
        fi

    - name: Global Deep Clean and Force Java 17 in ALL Gradle Files
      run: |
        python3 -c "
        import os

        print('Scanning all project files for Java/Kotlin version mismatches...')
        for root, dirs, files in os.walk('.'):
            # رد شدن از پوشه‌های بیلد و گریدل برای سرعت بیشتر
            if '.gradle' in root or 'build' in root or '.git' in root:
                continue
            for file in files:
                if file.endswith('.gradle.kts') or file.endswith('.gradle') or file.endswith('.properties'):
                    path = os.path.join(root, file)
                    try:
                        with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                            content = f.read()
                        
                        original = content
                        # جایگزینی ریشه‌ای تمام نسخه‌های قدیمی جاوا به 17
                        content = content.replace('VERSION_1_8', 'VERSION_17')
                        content = content.replace('1.8', '17')
                        content = content.replace('1.6', '17')
                        content = content.replace('javaVersion = JavaVersion.VERSION_1_8', 'javaVersion = JavaVersion.VERSION_17')
                        
                        if content != original:
                            with open(path, 'w', encoding='utf-8') as f:
                                f.write(content)
                            print(f'Successfully updated: {path}')
                    except Exception as e:
                        print(f'Skipped {path}: {e}')
        "

    - name: Generate Gradle Wrapper 8.9
      run: |
        gradle wrapper --gradle-version 8.9
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BitaMonitor-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
