name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract Zip and Structure Project
      run: |
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Unzipping $ZIP_FILE..."
          unzip -o -q "$ZIP_FILE" -d temp_extracted
        else
          echo "No zip file found!"
          exit 1
        fi
        
        PROJ_DIR=$(find temp_extracted -maxdepth 3 -name "settings.gradle.kts" -exec dirname {} \;)
        if [ -n "$PROJ_DIR" ]; then
          echo "Found project at: $PROJ_DIR"
          cp -r "$PROJ_DIR"/* .
        else
          echo "settings.gradle.kts not found!"
          exit 1
        fi

    - name: Automatically Rewrite app/build.gradle.kts to Java 17
      run: |
        python3 -c "
        import os

        gradle_path = 'app/build.gradle.kts'
        if os.path.exists(gradle_path):
            new_content = '''
plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

android {
    namespace = \"com.bitamonitor.app\"
    compileSdk = 34

    defaultConfig {
        applicationId = \"com.bitamonitor.app\"
        minSdk = 24
        targetSdk = 34
        versionCode = 1
        versionName = \"1.0\"

        testInstrumentationRunner = \"androidx.test.runner.AndroidJUnitRunner\"
    }

    buildTypes {
        release {
            isMinifyEnabled = false
            proguardFiles(
                getDefaultProguardFile(\"proguard-android-optimize.txt\"),
                \"proguard-rules.pro\"
            )
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = \"17\"
    }
}

dependencies {
    implementation(libs.androidx.core.ktx)
    implementation(libs.androidx.appcompat)
    implementation(libs.material)
    testImplementation(libs.junit)
    androidTestImplementation(libs.androidx.junit)
    androidTestImplementation(libs.androidx.espresso.core)
}
'''
            with open(gradle_path, 'w', encoding='utf-8') as f:
                f.write(new_content.strip())
            print('app/build.gradle.kts successfully overwritten with Java 17!')
        "

    - name: Generate Gradle Wrapper 8.9
      run: |
        gradle wrapper --gradle-version 8.9
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BitaMonitor-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
