name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Find and Unzip Project
      run: |
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Found zip file: $ZIP_FILE"
          mkdir -p temp_extracted
          unzip -o -q "$ZIP_FILE" -d temp_extracted
        else
          echo "No zip file found in repository!"
          exit 1
        fi
        
        SETTINGS_PATH=$(find temp_extracted -name "settings.gradle*" | head -n 1)
        if [ -n "$SETTINGS_PATH" ]; then
          PROJECT_DIR=$(dirname "$SETTINGS_PATH")
        else
          BUILD_PATH=$(find temp_extracted -name "build.gradle*" | head -n 1)
          PROJECT_DIR=$(dirname "$BUILD_PATH")
        fi
        
        if [ -n "$PROJECT_DIR" ]; then
          cp -r "$PROJECT_DIR"/* .
        else
          echo "No Android project found inside zip!"
          exit 1
        fi

    - name: Setup Gradle 7.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '7.5'

    - name: Build APK
      run: gradle assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BitaMonitor-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
