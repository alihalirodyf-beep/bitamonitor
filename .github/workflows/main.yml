name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract Zip and Structure Project
      run: |
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Unzipping $ZIP_FILE..."
          unzip -o -q "$ZIP_FILE" -d temp_extracted
        else
          echo "No zip file found!"
          exit 1
        fi
        
        PROJ_DIR=$(find temp_extracted -maxdepth 3 -name "settings.gradle.kts" -exec dirname {} \;)
        if [ -n "$PROJ_DIR" ]; then
          echo "Found project at: $PROJ_DIR"
          cp -r "$PROJ_DIR"/* .
        else
          echo "settings.gradle.kts not found!"
          exit 1
        fi

    - name: Safely Fix Java and Kotlin Compatibility in Gradle
      run: |
        python3 -c "
        import os, re

        gradle_path = 'app/build.gradle.kts'
        if os.path.exists(gradle_path):
            with open(gradle_path, 'r', encoding='utf-8') as f:
                content = f.read()
            
            # تغییر نسخه‌های جاوا از 1.8 به 17
            content = content.replace('VERSION_1_8', 'VERSION_17')
            
            # تنظیم دقیق jvmTarget روی 17 برای کاتلین
            content = re.sub(r'jvmTarget\s*=\s*[\"\\'].*?[\"\\']', 'jvmTarget = \"17\"', content)
            
            # اگر jvmTarget وجود نداشت، داخل kotlinOptions اضافه می‌کنیم
            if 'jvmTarget' not in content and 'kotlinOptions' in content:
                content = content.replace('kotlinOptions {', 'kotlinOptions {\n        jvmTarget = \"17\"')

            with open(gradle_path, 'w', encoding='utf-8') as f:
                f.write(content)
            print('Successfully updated app/build.gradle.kts to Java/Kotlin 17')
        else:
            print('Error: app/build.gradle.kts not found!')
        "

    - name: Generate Gradle Wrapper 8.9
      run: |
        gradle wrapper --gradle-version 8.9
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BitaMonitor-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
