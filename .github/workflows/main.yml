name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Find and Unzip Project
      run: |
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Found zip file: $ZIP_FILE"
          mkdir -p temp_extracted
          unzip -o -q "$ZIP_FILE" -d temp_extracted
        else
          echo "No zip file found in repository!"
          exit 1
        fi
        
        # Look for build.gradle or build.gradle.kts
        BUILD_GRADLE_PATH=$(find temp_extracted -name "build.gradle*" | head -n 1)
        if [ -n "$BUILD_GRADLE_PATH" ]; then
          PROJECT_DIR=$(dirname "$BUILD_GRADLE_PATH")
          cp -r "$PROJECT_DIR"/* .
        else
          echo "No build.gradle found inside zip!"
          exit 1
        fi

    - name: Setup Gradle Wrapper if missing
      run: |
        if [ ! -f "gradlew" ]; then
          echo "gradlew not found, generating wrapper..."
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BitaMonitor-APK
        path: app/build/outputs/apk/debug/app-debug.apk
