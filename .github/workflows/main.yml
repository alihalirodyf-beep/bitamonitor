name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract Zip and Structure Project
      run: |
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Unzipping $ZIP_FILE..."
          unzip -o -q "$ZIP_FILE" -d temp_extracted
        else
          echo "No zip file found!"
          exit 1
        fi
        
        PROJ_DIR=$(find temp_extracted -maxdepth 3 -name "settings.gradle.kts" -exec dirname {} \;)
        if [ -n "$PROJ_DIR" ]; then
          echo "Found project at: $PROJ_DIR"
          cp -r "$PROJ_DIR"/* .
        else
          echo "settings.gradle.kts not found!"
          exit 1
        fi

    - name: Ultimate JVM 17 Force Override
      run: |
        python3 -c "
        import os

        for root, dirs, files in os.walk('.'):
            for file in files:
                if file.endswith('.gradle.kts') or file.endswith('.gradle'):
                    path = os.path.join(root, file)
                    with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                        content = f.read()
                    
                    # جایگزینی همه‌جانبه تمام نسخه‌های قدیمی جاوا و کاتلین به 17
                    content = content.replace('VERSION_1_8', 'VERSION_17')
                    content = content.replace('1.8', '17')
                    content = content.replace('VERSION_1_6', 'VERSION_17')
                    
                    with open(path, 'w', encoding='utf-8') as f:
                        f.write(content)
                    print(f'Patched: {path}')
        "

    - name: Generate Gradle Wrapper 8.9
      run: |
        gradle wrapper --gradle-version 8.9
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BitaMonitor-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
