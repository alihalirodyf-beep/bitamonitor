name: Build Android APK from Zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Unzip project
      run: |
        unzip -q BitaBarMonitor__v3.zip -d extracted_project || unzip -q BitaBarMonitor_v3.zip -d extracted_project
        if [ -d "extracted_project/bitamonitor" ]; then
          cp -r extracted_project/bitamonitor/* .
        else
          cp -r extracted_project/* .
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: BitaMonitor-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
